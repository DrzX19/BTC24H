<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BTC Live — Login</title><link rel="stylesheet" href="../css/login.css"></head>
<body>
<main class="auth-shell"><section class="auth-card">
<div class="brand">₿ <b>BTC<span>LIVE</span></b></div>
<p class="eyebrow">Terminal profissional</p><h1 id="formTitle">Entrar na sua conta</h1>
<p class="subtitle" id="formSubtitle">Acesse seu terminal de Bitcoin em tempo real.</p>
<form id="authForm">
<div class="field register-only hidden"><label>Nome</label><input id="name" type="text" placeholder="Seu nome"></div>
<div class="field"><label>E-mail</label><input id="email" type="email" placeholder="voce@email.com" required></div>
<div class="field"><label>Senha</label><input id="password" type="password" placeholder="Senha" required></div>
<button class="primary" id="submitBtn">Entrar</button><p class="message" id="message"></p>
</form>
<button class="switch" id="switchMode" type="button">Ainda não tenho conta → Criar conta</button>
<p class="demo">Teste: admin@btclive.com / 123456</p>
</section></main><script src="../js/login.js"></script></body></html>
